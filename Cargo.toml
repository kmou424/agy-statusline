[package]
name = "agy-statusline"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
description = "Custom status line renderer for Antigravity CLI (agy)"
repository = "https://github.com/kmou424/agy-statusline"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-width = "0.2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
