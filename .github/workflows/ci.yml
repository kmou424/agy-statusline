name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches-ignore: [main]
    tags-ignore: ['*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Linux linker dependencies
        run: sudo apt-get update && sudo apt-get install -y clang mold
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.100.0'
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Linux linker dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang mold
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.100.0'
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked

  installer-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Test POSIX installer
        if: runner.os != 'Windows'
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == macOS ]] && ! command -v shellcheck >/dev/null; then
            brew install shellcheck
          fi
          shellcheck -s sh scripts/install.sh
          sh -n scripts/install.sh
          bash -n scripts/install.sh
          sh scripts/test-install.sh
          bash scripts/test-install.sh
      - name: Test PowerShell installer
        if: runner.os == 'Windows'
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/test-install.ps1

  package:
    needs: [lint, test, installer-tests]
    uses: ./.github/workflows/build-packages.yml
    with:
      version_label: ci-${{ github.sha }}
