[target.'cfg(target_os = "linux")']
linker = "clang"
rustflags = ["-C", "link-arg=-fuse-ld=mold"]

# Homebrew mold 3.0.0 ships ELF-only linking; macOS uses Apple ld by default.
# Once a mold release with ld64.mold (Mach-O) is installed, macOS builds can opt in via:
# [target.'cfg(target_os = "macos")']
# rustflags = ["-C", "link-arg=--ld-path=ld64.mold"]
